<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Ignoregen</title><desc id="d">Project templates become a generated gitignore file.</desc><defs><linearGradient id="bg"><stop stop-color="#19283d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#142b43" stroke="#8fa8ff" stroke-width="2"><rect x="95" y="80" width="260" height="155" rx="12"/><rect x="845" y="80" width="260" height="155" rx="12"/></g><g fill="#edf3ff" font-family="monospace" font-size="17"><text x="130" y="120">PYTHON</text><text x="130" y="160">NODE</text><text x="130" y="200">VSCODE</text><text x="885" y="120">.gitignore</text><text x="885" y="160">__pycache__/</text><text x="885" y="200">node_modules/</text></g><path d="M355 155H845" stroke="#62e3c1" stroke-width="4" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">IGNOREGEN</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">TEMPLATE / GENERATE / IGNORE</text></svg>