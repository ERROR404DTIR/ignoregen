<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="ignoregen">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#g)"/>
  <text x="60" y="95" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="54" font-weight="700" fill="#f1f5f9" opacity="0">ignoregen
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>
  <text x="62" y="135" font-family="system-ui,Segoe UI,sans-serif" font-size="20" fill="#9ca3af" opacity="0">A .gitignore in one command.
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1s" fill="freeze"/>
  </text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20">
    <rect x="560" y="32" width="290" height="136" rx="10" fill="#0b1220" stroke="#334155"/>
    <text x="580" y="62" fill="#38bdf8">$ ignoregen python node</text>
    <text x="580" y="92" fill="#a3e635" opacity="0">__pycache__/
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="580" y="118" fill="#a3e635" opacity="0">node_modules/
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" begin="1.3s" repeatCount="indefinite"/>
    </text>
    <text x="580" y="144" fill="#a3e635" opacity="0">.venv/
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" begin="2.1s" repeatCount="indefinite"/>
    </text>
    <rect x="828" y="48" width="10" height="20" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
